CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

#CONFIG_NET_LOG=y
CONFIG_LOG=y

CONFIG_SLIP_STATISTICS=n
CONFIG_NET_SHELL=y

# Ethernet carrier changes (and various networking deferred works)
# run on the system workqueue. On rpi_4b + networking + shell + logging,
# the default stack can be too small and can manifest as hard faults in
# the sysworkq thread.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# Networking threads need significantly larger stacks on AArch64 (64-bit)
# to avoid overflows during complex packet processing or high traffic.
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# # Avoid "whole system" hangs if a work handler misbehaves: by default the
# # system workqueue runs at cooperative priority (-1) which can starve all
# # preemptible threads (LED blink, shell, etc.). Make it preemptible.
# CONFIG_SYSTEM_WORKQUEUE_PRIORITY=10

# # If any system work handler runs too long, abort it and log the offender.
# CONFIG_WORKQUEUE_WORK_TIMEOUT=y
# CONFIG_SYSTEM_WORKQUEUE_WORK_TIMEOUT_MS=2000

# Detect/report stack overflows early (helps confirm root cause).
CONFIG_STACK_SENTINEL=y
CONFIG_EXCEPTION_STACK_TRACE=y

# Thread monitoring and analysis to debug hangs (manual trigger via shell)
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y

# Verbose logging for net_mgmt events to trace carrier-on flow
#CONFIG_NET_MGMT_EVENT_LOG_LEVEL_DBG=y

# Config dm9051 (such as my "overlay_dm9051.conf")
# --- Basic Network Configuration ---
CONFIG_NET_L2_ETHERNET=y
# Enable Ethernet management interface to receive carrier events
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_BUF_DATA_SIZE=2048
CONFIG_NET_IPV4_FRAGMENT=y
#(JJ.add))CONFIG_ETH_DM9051=y
CONFIG_ETH_DM9051=y
CONFIG_SPI=y
CONFIG_SPI_BITBANG=y
CONFIG_GPIO=y
#(JJ.add)CONFIG_ETH_DM9051_DEBUG_PRINTS=y
CONFIG_ETH_DM9051_DEBUG_PRINTS=y

# DM9051 RX thread: keep it preemptive but not too high priority,
# so it won't starve the UART shell on link-up/busy networks.
CONFIG_ETH_DM9051_RX_THREAD_PRIO=10
